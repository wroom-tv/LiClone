[package]
name = "liclone"
version = "1.0.0"
description = "LiClone — mount cloud storage with rclone, and see what still needs to upload"
authors = ["Wroom"]
license-file = "../LICENSE"
edition = "2021"

[lib]
name = "liclone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sysinfo = "0.33"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
which = "7"
walkdir = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
